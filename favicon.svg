<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2318"/>
      <stop offset="50%" stop-color="#163824"/>
      <stop offset="100%" stop-color="#22543d"/>
    </linearGradient>
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Modern Rounded Squircle Container -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Radial Atmosphere Accent -->
  <circle cx="32" cy="30" r="18" fill="#10b981" opacity="0.18"/>

  <!-- Palm & Sprout Agrotech Emblem -->
  <g filter="url(#glow)">
    <!-- Central Golden Spine / Stem -->
    <path d="M32 49 L32 23" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>

    <!-- Left Palm Fronds -->
    <path d="M32 39 C23 37 15 31 14 22 C21 22 28 29 32 34 Z" fill="url(#leafGrad2)"/>
    <path d="M32 30 C22 26 17 18 20 11 C26 13 29 21 32 25 Z" fill="url(#leafGrad1)"/>

    <!-- Right Palm Fronds -->
    <path d="M32 39 C41 37 49 31 50 22 C43 22 36 29 32 34 Z" fill="url(#leafGrad2)"/>
    <path d="M32 30 C42 26 47 18 44 11 C38 13 35 21 32 25 Z" fill="url(#leafGrad1)"/>

    <!-- Central Top Leaf Spear -->
    <path d="M32 8 C30 14 31 20 32 24 C33 20 34 14 32 8 Z" fill="#a7f3d0"/>

    <!-- Agro IoT Smart Golden Kernel Base -->
    <circle cx="32" cy="47" r="3.5" fill="url(#goldGrad)"/>
    <circle cx="32" cy="47" r="1.5" fill="#ffffff"/>
  </g>
</svg>
